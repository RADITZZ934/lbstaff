name: Deploy Application (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web-dashboard/**'
      - 'ecosystem.config.cjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend + Frontend
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Backend Environment (.env)
        shell: bash
        env:
          ENV_BACKEND: ${{ secrets.ENV_BACKEND }}
        run: |
          mkdir -p backend
          if [ -n "$ENV_BACKEND" ]; then
            echo "$ENV_BACKEND" > backend/.env
            echo "Successfully generated backend/.env from GitHub Secret ENV_BACKEND."
          else
            echo "PORT=10002" > backend/.env
            echo "Generated default backend/.env"
          fi

      - name: Setup Frontend Environment (.env)
        shell: bash
        env:
          ENV_FRONTEND: ${{ secrets.ENV_FRONTEND }}
        run: |
          mkdir -p web-dashboard
          if [ -n "$ENV_FRONTEND" ]; then
            echo "$ENV_FRONTEND" > web-dashboard/.env
            echo "Successfully generated web-dashboard/.env from GitHub Secret ENV_FRONTEND."
          else
            echo "PORT=10003" > web-dashboard/.env
            echo "NITRO_PORT=10003" >> web-dashboard/.env
            echo "NITRO_HOST=0.0.0.0" >> web-dashboard/.env
            echo "HOST=0.0.0.0" >> web-dashboard/.env
            echo "BACKEND_URL=http://127.0.0.1:10002" >> web-dashboard/.env
            echo "Generated default web-dashboard/.env"
          fi

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Install Frontend Dependencies & Build Nuxt
        env:
          PORT: ${{ secrets.PORT || '10003' }}
          NITRO_PORT: ${{ secrets.NITRO_PORT || '10003' }}
          NITRO_HOST: '0.0.0.0'
          HOST: '0.0.0.0'
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://127.0.0.1:10002' }}
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE || '' }}
          NODE_ENV: production
        run: |
          cd web-dashboard
          npm install
          npm run build

      - name: Deploy / Reload in PM2
        run: |
          npx pm2 delete lbstaff-backend lbstaff-frontend || true
          npx pm2 start ecosystem.config.cjs --update-env
          npx pm2 save
