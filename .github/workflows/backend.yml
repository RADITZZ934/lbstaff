name: Deploy Backend (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ecosystem.config.cjs'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to PM2 (Port 10002)
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Environment File (.env from secret)
        shell: bash
        env:
          ENV_BACKEND: ${{ secrets.ENV_BACKEND }}
        run: |
          mkdir -p backend
          if [ -n "$ENV_BACKEND" ]; then
            echo "$ENV_BACKEND" > backend/.env
            echo "Successfully generated backend/.env from GitHub Secret ENV_BACKEND."
          else
            echo "PORT=10002" > backend/.env
            echo "Generated default backend/.env"
          fi

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Deploy / Reload in PM2 (Port 10002)
        env:
          PORT: ${{ secrets.PORT || '10002' }}
          NODE_ENV: production
        run: |
          npx pm2 startOrReload ecosystem.config.cjs --only lbstaff-backend --update-env || npx pm2 restart lbstaff-backend --update-env || npx pm2 start backend/server.js --name "lbstaff-backend" --env PORT=10002
          npx pm2 save
